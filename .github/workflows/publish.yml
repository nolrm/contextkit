name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1 — newer than what
      # actions/setup-node's bundled Node 22.x ships by default.
      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Debug auth info
        run: |
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"
          npm whoami 2>&1 || echo "Not logged in via classic auth (expected — this publish uses OIDC Trusted Publishing instead)"

      - name: Check version and publish
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "🔍 Checking version: $CURRENT_VERSION"

          # Check if version exists on npm
          if npm view @nolrm/contextkit@$CURRENT_VERSION version > /dev/null 2>&1; then
            echo "⏭️  Version $CURRENT_VERSION already exists - skipping publish"
            echo "✅ No action needed"
          else
            echo "🚀 Publishing new version $CURRENT_VERSION..."
            npm publish --access public --provenance
            echo "✅ Successfully published @nolrm/contextkit@$CURRENT_VERSION"
            echo "📦 Package: https://www.npmjs.com/package/@nolrm/contextkit"
            echo "🚀 ContextKit is now available for installation!"

            # install/update/global-skills download command files from the
            # v$CURRENT_VERSION tag (not `main`), so older published CLI
            # versions keep working even after main's file layout changes.
            # The tag must exist for this exact version's downloads to resolve.
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$CURRENT_VERSION"
            # --no-verify: npm ci's "prepare" script sets core.hooksPath to
            # .contextkit/hooks for this repo, so this push would otherwise
            # run the dev pre-push quality gates against the CI runner (which
            # may be missing pnpm/etc). Tests already ran as their own step
            # above; this tag push is release bookkeeping, not new code.
            git push --no-verify origin "v$CURRENT_VERSION"
            echo "🏷️  Tagged and pushed v$CURRENT_VERSION"
          fi
